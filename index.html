<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyto Alba | Iniciar Sesión</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- LIBRERÍAS DE FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { dark: '#1e382b', hover: '#162b20', accent: '#c88a4b', accentHover: '#b5793e', bg: '#f4f3ed', border: '#e5e3d7' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-image: linear-gradient(rgba(30, 41, 59, 0.6), rgba(30, 41, 59, 0.6)), url('https://raw.githubusercontent.com/albertocolum/Seguimiento_Tyt_alb/main/fondo.jpg');
      background-attachment: fixed;
      background-position: center;
      background-size: cover;
    }
  </style>
</head>
<body class="text-stone-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl border border-brand-border shadow-xl w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-brand-dark rounded-2xl text-emerald-400 mb-2">
        <i data-lucide="bird" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-brand-dark">Tyto Alba Monitoreo</h1>
      <p class="text-xs text-stone-500">Inicia sesión para acceder al sistema de campo</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="tu_correo@ejemplo.com" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-dark bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-dark bg-white">
      </div>

      <div id="error-msg" class="text-xs text-rose-600 font-semibold hidden text-center"></div>

      <button type="submit" class="w-full bg-brand-accent hover:bg-brand-accentHover text-white font-semibold py-3 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar al Sistema
      </button>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgcdamrQ_4QbU-dZK-j2K-8GHz2U_JmVw",
      authDomain: "tytoalbamonitoreo.firebaseapp.com",
      databaseURL: "https://tytoalbamonitoreo-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tytoalbamonitoreo",
      storageBucket: "tytoalbamonitoreo.firebasestorage.app",
      messagingSenderId: "770240286093",
      appId: "1:770240286093:web:5d389a48e7580face9c1c4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch(err => {
          errorDiv.textContent = 'Credenciales incorrectas o usuario no registrado.';
          errorDiv.classList.remove('hidden');
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Si ya está logueado, redirigir directo al index
      auth.onAuthStateChanged(user => {
        if (user) window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
