<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lechuza Común (Tyto alba) — El Mirador de Aves</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #hero-section {
            background-image: linear-gradient(to bottom, rgba(11, 15, 25, 0.45), rgba(11, 15, 25, 0.92)), 
                              url('fondo.jpg'), 
                              url('https://github.com/albertocolum/Seguimiento_Tyt_alb/blob/main/fondo.jpg');
            background-size: cover;
            background-position: center 25%;
        }
        .glow-btn {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-200 bg-slate-950 overflow-x-hidden">

    <!-- PORTADA / HERO SECTION -->
    <section id="hero-section" class="fixed inset-0 z-40 flex flex-col items-center justify-between p-6 text-center">
        <div class="w-full flex justify-end">
            <span class="text-xs bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-1 rounded-full text-emerald-400 font-mono">
                <i class="fa-solid fa-feather mr-1"></i> Tyto alba Monitoring System
            </span>
        </div>

        <div class="max-w-3xl space-y-6">
            <div class="inline-block p-4 rounded-full bg-emerald-500/10 border border-emerald-500/30 backdrop-blur-md mb-2">
                <i class="fa-solid fa-kiwi-bird text-5xl text-emerald-400"></i>
            </div>
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white drop-shadow-md">
                Lechuza Común <span class="block text-2xl sm:text-3xl font-light italic text-emerald-400 mt-2">(Tyto alba)</span>
            </h1>
            <p class="text-lg sm:text-xl text-slate-300 max-w-2xl mx-auto font-light leading-relaxed">
                Plataforma integral para el control de cajas nido, seguimiento reproductor, biometría y anillamiento EURING.
            </p>
            <div class="pt-6">
                <!-- Redirección directa a app.html -->
                <a href="registro.html" class="glow-btn px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-lg rounded-xl shadow-lg transition cursor-pointer inline-flex items-center gap-3">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar al Registro / Introducir Datos
                </a>
            </div>
        </div>

        <div class="text-xs text-slate-400 pb-2">
            <p><i class="fa-solid fa-shield-halved mr-1 text-emerald-400"></i> Almacenamiento local seguro & Exportación Excel (.xlsx) / JSON</p>
        </div>
    </section>

</body>
</html>
