    <script>
        // Data State
        let nests = JSON.parse(localStorage.getItem('tyto_nests')) || [];
        let map, tempMarker;
        let nestMarkers = [];

        // Map Tile Layers Configuration
        const mapLayers = {
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            }),
            street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.pt.png', {
                attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
            })
        };

        // Initialize Map with layer control
        function initMap() {
            if (map) return;
            
            // Madrid center by default
            map = L.map('map', {
                center: [40.4167, -3.7037],
                zoom: 6,
                layers: [mapLayers.satellite] // Esri World Imagery as default
            });

            // Layer Selector Control
            const baseMaps = {
                "<span class='text-xs font-medium text-slate-800'>Satélite (Esri)</span>": mapLayers.satellite,
                "<span class='text-xs font-medium text-slate-800'>Callejero (OSM)</span>": mapLayers.street,
                "<span class='text-xs font-medium text-slate-800'>Relieve (OpenTopo)</span>": mapLayers.topo
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

            // Click listener for location selection
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                updateSelectedLocation(lat, lng, true);
            });

            renderNestMarkers();
        }

        // Reverse Geocoding with OpenStreetMap Nominatim API
        async function fetchReverseGeocode(lat, lng) {
            const spinner = document.getElementById('geo-loading-spinner');
            if (spinner) spinner.classList.remove('hidden');

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`, {
                    headers: {
                        'Accept-Language': 'es'
                    }
                });
                if (!response.ok) throw new Error('Geocoding error');
                const data = await response.json();
                
                if (data && data.address) {
                    const addr = data.address;
                    // Detect town/municipality from various OSM tags
                    const townName = addr.town || addr.village || addr.city || addr.municipality || addr.suburb || addr.county || '';
                    const provinceName = addr.province || addr.state || '';

                    if (townName) {
                        document.getElementById('nest-location').value = townName;
                    }
                    if (provinceName && !document.getElementById('nest-province').value) {
                        document.getElementById('nest-province').value = provinceName;
                    }
                }
            } catch (err) {
                console.warn('Geocoding no disponible en este momento:', err);
            } finally {
                if (spinner) spinner.classList.add('hidden');
            }
        }

        // Helper to update marker, form coordinates and query town
        function updateSelectedLocation(lat, lng, triggerGeocode = true) {
            const formattedLat = parseFloat(lat).toFixed(6);
            const formattedLng = parseFloat(lng).toFixed(6);

            document.getElementById('nest-lat').value = formattedLat;
            document.getElementById('nest-lng').value = formattedLng;

            if (tempMarker) {
                tempMarker.setLatLng([lat, lng]);
            } else {
                tempMarker = L.marker([lat, lng], {
                    draggable: true,
                    icon: L.divIcon({
                        className: 'custom-temp-marker',
                        html: `<div class="w-6 h-6 bg-amber-500 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-slate-900 text-xs font-bold animate-pulse"><i class="fas fa-plus"></i></div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).addTo(map);

                tempMarker.on('dragend', function(evt) {
                    const pos = evt.target.getLatLng();
                    updateSelectedLocation(pos.lat, pos.lng, true);
                });
            }

            if (triggerGeocode) {
                fetchReverseGeocode(lat, lng);
            }
        }

        // Render markers of all saved nests
        function renderNestMarkers() {
            nestMarkers.forEach(m => map.removeLayer(m));
            nestMarkers = [];

            nests.forEach(nest => {
                const iconHtml = `<div class="w-8 h-8 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-xs" style="background-color: ${nest.status === 'Ocupado' ? '#10b981' : nest.status === 'Desocupado' ? '#64748b' : '#f59e0b'}">
                    <i class="fas fa-feather-alt"></i>
                </div>`;

                const markerIcon = L.divIcon({
                    className: 'custom-nest-marker',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([nest.lat, nest.lng], { icon: markerIcon })
                    .bindPopup(`
                        <div class="text-slate-900 p-1 font-sans">
                            <h4 class="font-bold text-sm text-emerald-700">${nest.code}</h4>
                            <p class="text-xs font-semibold text-slate-600">${nest.location || 'Sin ubicación'} ${nest.province ? `(${nest.province})` : ''}</p>
                            <div class="mt-1 text-[11px] text-slate-500">
                                <div><strong>Estado:</strong> ${nest.status}</div>
                                <div><strong>Tipo:</strong> ${nest.type}</div>
                            </div>
                            <button onclick="selectNest('${nest.id}')" class="mt-2 w-full bg-emerald-600 text-white text-xs py-1 rounded hover:bg-emerald-700 transition">Ver Inspecciones</button>
                        </div>
                    `);
                
                marker.addTo(map);
                nestMarkers.push(marker);
            });
        }

        // Event listener for manual coordinate button
        document.getElementById('btn-locate-coords')?.addEventListener('click', () => {
            const latVal = parseFloat(document.getElementById('nest-lat').value);
            const lngVal = parseFloat(document.getElementById('nest-lng').value);

            if (!isNaN(latVal) && !isNaN(lngVal) && latVal >= -90 && latVal <= 90 && lngVal >= -180 && lngVal <= 180) {
                map.setView([latVal, lngVal], 14);
                updateSelectedLocation(latVal, lngVal, true);
            } else {
                alert("Por favor, introduce una latitud (-90 a 90) y longitud (-180 a 180) válidas en grados decimales.");
            }
        });

        // Clear temp marker when resetting form
        function resetNestForm() {
            document.getElementById('nest-form').reset();
            document.getElementById('nest-id').value = '';
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
            }
        }
