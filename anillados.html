<!-- FORMULARIO DE NUEVO ANILLAMIENTO -->
<form id="ring-form" onsubmit="handleRingSubmit(event)" class="bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-2xl border border-brand-border shadow-md space-y-8">
  
  <!-- SELECCIÓN DE NIDO Y DATOS DE CAPTURA -->
  <div class="space-y-4">
    <h3 class="text-sm font-bold text-brand-dark uppercase tracking-wider border-b border-brand-border pb-2 flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-sky-600"></i> 1. Procedencia de la Captura</h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Nido de Procedencia *</label>
        <select id="nestSelect" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white font-semibold">
          <option value="">Cargando nidos desde la nube...</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Fecha de Anillamiento *</label>
        <input type="date" id="ringDate" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Edad / Categoría *</label>
        <select id="birdAge" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white font-semibold">
          <option value="Pollo">Pollo</option>
          <option value="Adulto">Adulto</option>
        </select>
      </div>
    </div>
  </div>

  <!-- IDENTIFICACIÓN DE ANILLAS -->
  <div class="space-y-4">
    <h3 class="text-sm font-bold text-brand-dark uppercase tracking-wider border-b border-brand-border pb-2 flex items-center gap-2"><i data-lucide="tag" class="w-4 h-4 text-sky-600"></i> 2. Marcas e Identificación</h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-stone-50/80 p-4 rounded-xl border">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Anilla Metálica (Aranzadi / CGB) *</label>
        <input type="text" id="metalRing" required placeholder="Ej. G-12345 o NX-987" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm uppercase font-mono bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Anilla PVC / Color (Opcional)</label>
        <input type="text" id="pvcRing" placeholder="Ej. A-12 (Negro/Blanco)" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm uppercase font-mono bg-white">
      </div>
    </div>
  </div>

  <!-- DATOS BIOMÉTRICOS -->
  <div class="space-y-4">
    <h3 class="text-sm font-bold text-brand-dark uppercase tracking-wider border-b border-brand-border pb-2 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4 text-sky-600"></i> 3. Biometría Científica</h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 bg-stone-50/80 p-4 rounded-xl border">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Sexo</label>
        <select id="sex" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
          <option value="Desconocido">Desconocido</option>
          <option value="Macho">Macho</option>
          <option value="Hembra">Hembra</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Ala Max (mm)</label>
        <input type="number" step="0.5" id="wingChord" placeholder="Ej. 290" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">P8 (mm)</label>
        <input type="number" step="0.5" id="p8" placeholder="Ej. 185" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Tarso (mm)</label>
        <input type="number" step="0.1" id="tarsus" placeholder="Ej. 62.0" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">Peso (gramos)</label>
        <input type="number" step="0.1" id="weight" placeholder="Ej. 320.5" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm bg-white">
      </div>
    </div>
  </div>

  <!-- OBSERVACIONES -->
  <div class="space-y-2">
    <label class="block text-xs font-bold text-stone-600">Observaciones Biométricas / Estado Físico</label>
    <textarea id="ringNotes" rows="2" placeholder="Condición corporal, muda, desarrollo de plumas..." class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
  </div>

  <div class="flex justify-end pt-4 border-t">
    <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md flex items-center gap-2 text-sm"><i data-lucide="save" class="w-4 h-4"></i> Guardar Registro de Anillamiento</button>
  </div>
</form>

<!-- HISTORIAL DE AVES ANILLADAS -->
<div class="bg-white/95 backdrop-blur-sm rounded-2xl border border-brand-border shadow-md overflow-hidden">
  <div class="p-6 border-b border-brand-border flex justify-between items-center flex-wrap gap-4">
    <div>
      <h2 class="text-lg font-bold text-stone-800">Historial de Aves Anilladas</h2>
      <p class="text-xs text-stone-500 mt-1">Listado completo de pollos y adultos registrados en la nube</p>
    </div>
    <div>
      <input type="text" id="searchFilter" oninput="filterRingHistory()" placeholder="Filtrar por nido o anilla..." class="px-3 py-2 border border-stone-300 rounded-xl text-xs bg-white w-64">
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-left text-xs">
      <thead class="bg-stone-50/80 text-stone-500 uppercase font-bold border-b border-brand-border">
        <tr>
          <th class="px-4 py-3">Nido</th>
          <th class="px-4 py-3">Fecha</th>
          <th class="px-4 py-3">Categoría</th>
          <th class="px-4 py-3">Anilla Metálica</th>
          <th class="px-4 py-3">PVC</th>
          <th class="px-4 py-3">Sexo</th>
          <th class="px-4 py-3">Ala Max</th>
          <th class="px-4 py-3">P8</th>
          <th class="px-4 py-3">Tarso</th>
          <th class="px-4 py-3">Peso</th>
          <th class="px-4 py-3 text-right">Acción</th>
        </tr>
      </thead>
      <tbody id="ring-history-body" class="divide-y divide-brand-border font-medium text-stone-700">
        <tr><td colspan="11" class="px-6 py-4 text-center text-stone-400">Cargando registros...</td></tr>
      </tbody>
    </table>
  </div>
</div>
