<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyto Alba | Panel de Control</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- LIBRERÍAS DE FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#1e382b',
              hover: '#162b20',
              accent: '#c88a4b',
              accentHover: '#b5793e',
              bg: '#f4f3ed',
              border: '#e5e3d7'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen">

  <!-- CABECERA PRINCIPAL CON BOTÓN DE CERRAR SESIÓN -->
  <header class="bg-brand-dark text-white shadow-lg px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-white p-0.5 overflow-hidden">
        <img src="logo.png" alt="GER Logo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://raw.githubusercontent.com/albertocolum/Seguimiento_Tyt_alb/main/logo_ger.png'">
      </div>
      <div>
        <h1 class="font-extrabold text-lg leading-tight tracking-wide">Tyto Alba</h1>
        <p class="text-xs text-emerald-400 font-medium">Monitoreo de Cajas Nido — GER</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <span id="user-display-email" class="text-xs text-stone-300 font-medium hidden sm:inline"></span>
      <button onclick="cerrarSesion()" class="bg-rose-700/80 hover:bg-rose-700 text-white text-xs font-semibold px-3 py-2 rounded-xl transition-all shadow flex items-center gap-1.5">
        <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL DEL PANEL -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
      <h2 class="text-xl font-bold text-stone-900 mb-2">Bienvenido al Panel de Monitoreo</h2>
      <p class="text-sm text-stone-600">Sistema activo y protegido correctamente mediante Firebase Auth.</p>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgcdamrQ_4QbU-dZK-j2K-8GHz2U_JmVw",
      authDomain: "tytoalbamonitoreo.firebaseapp.com",
      databaseURL: "https://tytoalbamonitoreo-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tytoalbamonitoreo",
      storageBucket: "tytoalbamonitoreo.firebasestorage.app",
      messagingSenderId: "770240286093",
      appId: "1:770240286093:web:5d389a48e7580face9c1c4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- PROTECCIÓN DE SEGURIDAD (REDIRECCIÓN A INDEX.HTML SI NO HAY SESIÓN) ---
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'index.html';
      } else {
        const userEmailElem = document.getElementById('user-display-email');
        if (userEmailElem) userEmailElem.textContent = user.email;
      }
    });

    // --- FUNCIÓN PARA CERRAR SESIÓN ---
    function cerrarSesion() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch(err => {
          console.error('Error al cerrar sesión:', err);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
